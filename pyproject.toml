[project]
name = "vietnamese-fable-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
eval = ["textstat>=0.7", "scipy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "trieulh/tests"]
