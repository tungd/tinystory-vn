[project]
name = "english-fable-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
inference = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
colab = [
    "transformers>=4.44",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "accelerate>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
